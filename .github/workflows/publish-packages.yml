name: Release (Tag-Based)
on:
  push:
    tags:
      - "v*"

jobs:
  build-packages:
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ext: |
              target/AmerecoLauncher*.deb
              target/AmerecoLauncher*.rpm
              target/AmerecoLauncher*.AppImage
          - os: windows-latest
            ext: |
              target/AmerecoLauncher*.exe
              target/AmerecoLauncher*.msi
              target/AmerecoLauncher*.msm
          - os: macos-latest
            ext: |
              target/AmerecoLauncher*.pkg
              target/AmerecoLauncher*.dmg
    steps:
      - name: Configure Maven settings for GitHub Packages
        shell: bash
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Get OS info
        run: mvn enforcer:display-info

      - name: List active profiles
        run: mvn help:active-profiles "-Dpackager.javapackager" "-Ddownload-jdk"

      - name: Build
        run: mvn clean package "-Dpackager.javapackager" "-Ddownload-jdk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: warn
          name: AmerecoLauncher_${{ runner.os }}-${{ runner.arch }}
          path: ${{ matrix.ext }}

  build-jar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Get OS info
        run: mvn enforcer:display-info

      - name: List active profiles
        run: mvn help:active-profiles "-Dpackager.jar"

      - name: Build
        run: mvn clean package "-Dpackager.jar"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: AmerecoLauncher.jar
          path: target/AmerecoLauncher*.jar

  release:
    needs: [build-jar, build-packages]
    # Публикуем только когда собрались ВСЕ платформы. С `always()` упавшая сборка
    # под одну ОС всё равно давала релиз — а он становится `latest`, и лаунчер на
    # этой ОС переставал обновляться: своего ассета в релизе он не находит.
    # Именно так вышел неполный v1.4.0 без .exe и .msi.
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      # Артефакты приходят как AmerecoLauncher-<version>-<os>-<arch>.<ext>
      # (имя задаётся антраном rename-package-artifacts в pom.xml).
      # Убираем ТОЛЬКО версию — итог: AmerecoLauncher-<os>-<arch>.<ext>.
      # Стабильное имя нужно для прямых ссылок вида
      # releases/latest/download/AmerecoLauncher-linux-x64.deb (см. LauncherUpdater).
      - name: Normalize asset names (name-os-arch.ext)
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name 'AmerecoLauncher-*' -print | while IFS= read -r f; do
            dir=$(dirname "$f")
            base=$(basename "$f")
            new=$(printf '%s' "$base" | sed -E \
              -e 's/^(AmerecoLauncher)-[0-9]+(\.[0-9]+)*(-[A-Za-z0-9.]+)?-(linux|windows|mac)-/\1-\4-/' \
              -e 's/^(AmerecoLauncher)-[0-9]+(\.[0-9]+)*(-[A-Za-z0-9.]+)?\.jar$/\1.jar/')
            if [ "$base" != "$new" ]; then
              echo "rename: $base -> $new"
              mv -f "$f" "$dir/$new"
            fi
          done

      # Клиент (LauncherUpdater) обязан сверить SHA-256 скачанного установщика
      # с этим файлом и отказаться от установки, если суммы нет или она не сошлась.
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name 'AmerecoLauncher*' -print0 \
            | sort -z \
            | while IFS= read -r -d '' f; do
                ( cd "$(dirname "$f")" && sha256sum "$(basename "$f")" )
              done > SHA256SUMS
          cat SHA256SUMS

      - name: List release assets
        shell: bash
        run: find . -type f -name 'AmerecoLauncher*' -printf '%f\t%s\n' | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AmerecoLauncher*/AmerecoLauncher*.deb
            AmerecoLauncher*/AmerecoLauncher*.rpm
            AmerecoLauncher*/AmerecoLauncher*.AppImage
            AmerecoLauncher*/AmerecoLauncher*.exe
            AmerecoLauncher*/AmerecoLauncher*.msi
            AmerecoLauncher*/AmerecoLauncher*.pkg
            AmerecoLauncher*/AmerecoLauncher*.dmg
            AmerecoLauncher*/AmerecoLauncher*.jar
            SHA256SUMS
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}